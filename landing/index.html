<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <meta name="description" content="Expenny - A free and open-source expense tracker that simplifies the process of tracking, managing, and sharing your expenses." />
    <title>Expenny - Free &amp; Open Source Expense Tracker</title>
    <style>
        @font-face {
            font-family: "DM Sans";
            src: url("./assets/DMSans.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Space Grotesk";
            src: url("./assets/SpaceGrotesk.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --background: #faf8f5;
            --foreground: #0f1419;
            --muted-foreground: #676f7e;
            --primary: #3fa681;
            --primary-foreground: #ffffff;
            --accent: #e7f4f0;
            --border: #e5e2dc;
            --font-sans: "DM Sans", sans-serif;
            --font-grotesk: "Space Grotesk", sans-serif;
        }

        .dark {
            --background: #000000;
            --foreground: #e7e9ea;
            --muted-foreground: #72767a;
            --primary: #3fa681;
            --primary-foreground: #ffffff;
            --accent: #102a21;
            --border: #292929;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--foreground);
            font-family: var(--font-sans);
            letter-spacing: 0em;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: var(--background);
            border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
        }

        .header-inner {
            max-width: 1440px;
            margin-inline: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 4rem;
            padding-inline: 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-grotesk);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .brand img {
            height: 2rem;
            width: 2rem;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border: none;
            border-radius: 0.6rem;
            background: transparent;
            color: var(--foreground);
            cursor: pointer;
            font-size: 1.1rem;
        }
        .icon-btn:hover {
            background: color-mix(in srgb, var(--accent) 50%, transparent);
        }

        /* Hero */
        .hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100svh;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            padding: 6rem 1rem 8rem;
        }

        .hero-inner {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 1.5rem;
        }

        .hero-copy {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            max-width: 42rem;
            padding-inline: 1rem;
            text-align: center;
        }

        .eyebrow {
            display: flex;
            justify-content: center;
            background: color-mix(in srgb, var(--accent) 80%, transparent);
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
        }
        .eyebrow span {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
        }

        h1 {
            margin: 0;
            font-family: var(--font-grotesk);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.05;
            text-wrap: balance;
        }
        h1 .accent {
            display: block;
            margin-top: 0.25rem;
            color: var(--primary);
        }

        .sub {
            max-width: 36rem;
            margin: 0;
            color: var(--muted-foreground);
            font-size: 1.06rem;
            line-height: 1.7;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            padding: 0.85rem 1.65rem;
            border-radius: 0.6rem;
            background: var(--primary);
            color: var(--primary-foreground);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .cta:hover {
            transform: scale(1.05);
        }
        .cta:active {
            transform: scale(0.95);
        }
        .cta .arrow {
            transition: transform 0.2s ease;
        }
        .cta:hover .arrow {
            transform: translateX(2px);
        }

        .scroll-hint {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 2rem;
            width: 1.25rem;
            padding: 0.375rem 0;
            border: 1px solid color-mix(in srgb, var(--muted-foreground) 30%, transparent);
            border-radius: 999px;
        }
        .scroll-hint .dot {
            width: 0.25rem;
            height: 0.375rem;
            border-radius: 999px;
            background: color-mix(in srgb, var(--muted-foreground) 50%, transparent);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fade-up 0.6s ease-out forwards; }
        .animate-fade-up-delay-1 { animation: fade-up 0.6s ease-out 0.15s forwards; }
        .animate-fade-up-delay-2 { animation: fade-up 0.6s ease-out 0.3s forwards; }
        .animate-fade-up-delay-3 { animation: fade-up 0.6s ease-out 0.45s forwards; }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .scroll-hint .dot,
            .animate-fade-up,
            .animate-fade-up-delay-1,
            .animate-fade-up-delay-2,
            .animate-fade-up-delay-3 {
                animation: none;
                opacity: 1;
            }
        }

        @media (min-width: 640px) {
            h1 { font-size: 3rem; }
        }
        @media (min-width: 768px) {
            h1 { font-size: 3.75rem; }
        }
        @media (max-width: 639px) {
            h1 { font-size: 2.25rem; }
            .sub { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="brand">
                <img src="./assets/favicon.ico" alt="Expenny" />
                <span>Expenny</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-inner">
                <div class="hero-copy">
                    <div class="eyebrow animate-fade-up">
                        <span>Build Financial Habits</span>
                    </div>
                    <div class="animate-fade-up-delay-1">
                        <h1>
                            Take Control of Your Finances with
                            <span class="accent">Expenny</span>
                        </h1>
                    </div>
                    <p class="sub animate-fade-up-delay-2">
                        Expenny is a free and open-source expense tracker that helps you with financial clarity
                    </p>
                    <div class="animate-fade-up-delay-3">
                        <a class="cta" href="#" target="_blank" rel="noopener">
                            Get Started
                            <span class="arrow" aria-hidden="true">→</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="scroll-hint" aria-hidden="true">
                <div class="dot"></div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            var root = document.documentElement;
            var saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) {}
            var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var theme = saved === "light" || saved === "dark" ? saved : (systemDark ? "dark" : "light");
            root.classList.toggle("dark", theme === "dark");
            var btn = document.getElementById("theme-toggle");
            var render = function () {
                btn.textContent = theme === "dark" ? "☀" : "☾";
            };
            render();
            btn.addEventListener("click", function () {
                theme = theme === "dark" ? "light" : "dark";
                try { localStorage.setItem("theme", theme); } catch (e) {}
                root.classList.toggle("dark", theme === "dark");
                render();
            });
        })();
    </script>
</body>
</html>
