<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <meta name="description"
        content="Expenny - A free and open-source expense tracker that simplifies the process of tracking, managing, and sharing your expenses." />
    <title>Expenny</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        (function () {
            var root = document.documentElement;
            var saved = null;
            try {saved = localStorage.getItem("theme");} catch (e) { }
            var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var isDark = saved === "dark" || (!saved && systemDark);
            root.classList.toggle("dark", isDark);
        })();
    </script>
    <style type="text/tailwindcss">
        @import 'tailwindcss';

        @custom-variant dark (&:where(.dark, .dark *));

        @font-face {
            font-family: "DM Sans";
            src: url("./assets/DMSans.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Space Grotesk";
            src: url("./assets/SpaceGrotesk.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --background: rgb(250, 248, 245);
            --foreground: rgb(15, 20, 25);
            --card: rgb(255, 255, 255);
            --card-foreground: rgb(15, 20, 25);
            --popover: rgb(255, 255, 255);
            --popover-foreground: rgb(15, 20, 25);
            --primary: rgb(63, 166, 129);
            --primary-foreground: rgb(255, 255, 255);
            --secondary: rgb(15, 20, 25);
            --secondary-foreground: rgb(255, 255, 255);
            --muted: rgb(240, 236, 230);
            --muted-foreground: rgb(103, 111, 126);
            --accent: rgb(231, 244, 240);
            --accent-foreground: rgb(63, 166, 129);
            --destructive: rgb(244, 33, 46);
            --destructive-foreground: rgb(255, 255, 255);
            --border: rgb(229, 226, 220);
            --input: rgb(248, 245, 242);
            --ring: rgb(63, 166, 129);
            --font-sans: "DM Sans", sans-serif;
            --font-serif: Georgia, serif;
            --font-mono: Menlo, monospace;
            --radius: 0.6rem;
            --tracking-normal: 0em;
        }

        @theme {
            --color-background: var(--background);
            --color-foreground: var(--foreground);
            --color-card: var(--card);
            --color-card-foreground: var(--card-foreground);
            --color-popover: var(--popover);
            --color-popover-foreground: var(--popover-foreground);
            --color-primary: var(--primary);
            --color-primary-foreground: var(--primary-foreground);
            --color-secondary: var(--secondary);
            --color-secondary-foreground: var(--secondary-foreground);
            --color-muted: var(--muted);
            --color-muted-foreground: var(--muted-foreground);
            --color-accent: var(--accent);
            --color-accent-foreground: var(--accent-foreground);
            --color-destructive: var(--destructive);
            --color-destructive-foreground: var(--destructive-foreground);
            --color-border: var(--border);
            --color-input: var(--input);
            --color-ring: var(--ring);
            --font-sans: var(--font-sans);
            --font-mono: var(--font-mono);
            --font-serif: var(--font-serif);
            --font-grotesk: Space Grotesk, sans-serif;
            --radius-sm: calc(var(--radius) - 4px);
            --radius-md: calc(var(--radius) - 2px);
            --radius-lg: var(--radius);
            --radius-xl: calc(var(--radius) + 4px);
        }

        .dark {
            --background: rgb(0, 0, 0);
            --foreground: rgb(231, 233, 234);
            --card: rgb(23, 23, 23);
            --card-foreground: rgb(217, 217, 217);
            --popover: rgb(0, 0, 0);
            --popover-foreground: rgb(231, 233, 234);
            --primary: rgb(63, 166, 129);
            --primary-foreground: rgb(255, 255, 255);
            --secondary: rgb(240, 243, 244);
            --secondary-foreground: rgb(15, 20, 25);
            --muted: rgb(10, 10, 10);
            --muted-foreground: rgb(114, 118, 122);
            --accent: rgb(16, 42, 33);
            --accent-foreground: rgb(255, 255, 255);
            --destructive: rgb(244, 33, 46);
            --destructive-foreground: rgb(255, 255, 255);
            --border: rgb(41, 41, 41);
            --input: rgb(36, 36, 36);
            --ring: rgb(63, 166, 129);
        }

        @layer base {
            * {
                @apply border-border outline-ring/50;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                @apply bg-background text-foreground;
                letter-spacing: var(--tracking-normal);
            }
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-up {
            animation: fade-up 0.6s ease-out forwards;
        }

        .animate-fade-up-delay-1 {
            animation: fade-up 0.6s ease-out 0.15s forwards;
        }

        .animate-fade-up-delay-2 {
            animation: fade-up 0.6s ease-out 0.3s forwards;
        }

        .animate-fade-up-delay-3 {
            animation: fade-up 0.6s ease-out 0.45s forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .animate-fade-up,
            .animate-fade-up-delay-1,
            .animate-fade-up-delay-2,
            .animate-fade-up-delay-3 {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>

<body class="antialiased">
    <header class="fixed top-0 left-0 right-0 z-50 bg-background border-b border-border/40">
        <div class="max-w-[1440px] mx-auto flex items-center justify-between h-16 px-6">
            <div class="flex items-center gap-2 font-grotesk font-bold text-lg">
                <img class="w-8 h-8" src="./assets/favicon.ico" alt="Expenny" />
                <span>Expenny</span>
            </div>
            <div>
                <button
                    class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-transparent text-foreground cursor-pointer text-xl border border-border shadow-[inset_0_2px_0_rgba(255,255,255,0.45),0_4px_0_rgba(0,0,0,0.1)] transition-all duration-200 hover:bg-accent/50 hover:-translate-y-px hover:shadow-[inset_0_2px_0_rgba(255,255,255,0.45),0_5px_0_rgba(0,0,0,0.1)] active:translate-y-[3px] active:shadow-[inset_0_1px_0_rgba(255,255,255,0.45),0_1px_0_rgba(0,0,0,0.1)]"
                    id="theme-toggle" type="button" aria-label="Toggle theme"></button>
            </div>
        </div>
    </header>

    <main>
        <section
            class="relative flex flex-col items-center justify-center min-h-svh overflow-hidden border-b border-border py-24 px-4 pb-32">
            <div class="relative z-10 flex flex-col items-center w-full gap-6">
                <div class="relative z-10 flex flex-col items-center gap-6 max-w-4xl px-4 text-center">
                    <div class="flex justify-center bg-accent/80 px-6 py-3 rounded-full animate-fade-up">
                        <span class="text-sm font-semibold uppercase tracking-wider text-primary">Build Financial
                            Habits</span>
                    </div>
                    <div class="animate-fade-up-delay-1">
                        <h1
                            class="m-0 font-grotesk font-bold tracking-tight leading-[1.05] text-balance text-[2.5rem] sm:text-[3.5rem] md:text-[4.5rem]">
                            Take Control of Your Finances with
                            <span class="block mt-1 text-primary">Expenny</span>
                        </h1>
                    </div>
                    <p
                        class="max-w-xl m-0 text-muted-foreground text-[1.05rem] sm:text-lg leading-relaxed animate-fade-up-delay-2">
                        Expenny is a free and open-source expense tracker that helps you with financial clarity
                    </p>
                    <div class="animate-fade-up-delay-3">
                        <a class="group inline-flex items-center gap-2 justify-center py-[0.85rem] px-[1.65rem] rounded-xl bg-primary text-primary-foreground font-semibold text-base no-underline font-grotesk shadow-[inset_0_2px_0_rgba(255,255,255,0.45),0_5px_0_color-mix(in_srgb,var(--color-primary)_72%,black)] transition-all duration-200 hover:brightness-90 hover:-translate-y-0.5 hover:shadow-[inset_0_2px_0_rgba(255,255,255,0.45),0_7px_0_color-mix(in_srgb,var(--color-primary)_72%,black)] active:translate-y-1 active:shadow-[inset_0_1px_0_rgba(255,255,255,0.45),0_2px_0_color-mix(in_srgb,var(--color-primary)_72%,black)]"
                            href="https://app.expenny.co.za" target="_blank" rel="noopener">
                            Get Started
                            <span class="transition-transform duration-200 group-hover:translate-x-0.5"
                                aria-hidden="true">→</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script>
        (function () {
            var btn = document.getElementById("theme-toggle");
            var root = document.documentElement;
            var sunIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
            var moonIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
            var render = function () { btn.innerHTML = root.classList.contains("dark") ? sunIcon : moonIcon; };
            render();
            btn.addEventListener("click", function () {
                var dark = !root.classList.contains("dark");
                root.classList.toggle("dark", dark);
                try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) { }
                render();
            });
        })();
    </script>
</body>

</html>
