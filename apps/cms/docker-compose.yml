version: "3.8"

services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: strapi-cms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "1337:1337"
    volumes:
      - ./public/uploads:/opt/app/public/uploads
      - strapi-node-modules:/opt/app/node_modules
    networks:
      - strapi-network
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337/_health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

volumes:
  strapi-node-modules:

networks:
  strapi-network:
    driver: bridge
